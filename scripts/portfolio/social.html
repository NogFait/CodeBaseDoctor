<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>CodeBase Doctor IA — social preview</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&display=swap');

  :root { --navy-900: #0a1535; --navy-950: #060d24; --blue: #2b8cff; --ink-soft: #b9c6e6; }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1280px; height: 640px; overflow: hidden; }
  body {
    font-family: 'Poppins', system-ui, sans-serif; color: #fff; position: relative;
    background-color: var(--navy-950);
    background-image:
      linear-gradient(160deg, var(--navy-900), var(--navy-950));
  }
  body::before {
    content: ''; position: absolute; inset: 0;
    background-image: radial-gradient(rgba(125, 180, 255, .16) 1.3px, transparent 1.3px);
    background-size: 26px 26px;
    -webkit-mask-image: linear-gradient(90deg, transparent 0%, #000 35%, transparent 70%);
            mask-image: linear-gradient(90deg, transparent 0%, #000 35%, transparent 70%);
  }

  /* GitHub recorta ~40px de margen: todo el texto queda dentro de esa zona segura */
  .left { position: absolute; left: 72px; top: 64px; width: 580px; }
  .badge {
    width: 80px; height: 80px; border-radius: 20px; background: #fff; display: grid; place-items: center;
    box-shadow: 0 14px 40px rgba(0, 0, 0, .45);
  }
  .badge img { width: 58px; height: 58px; }
  h1 { margin-top: 34px; font-weight: 800; font-size: 78px; line-height: 1.03; letter-spacing: -2px; }
  h1 .doctor { color: var(--blue); }
  .tagline { margin-top: 24px; font-size: 25px; line-height: 1.45; font-weight: 500; color: var(--ink-soft); }
  .tagline b { color: #fff; font-weight: 600; }
  .stack {
    margin-top: 34px; display: inline-block; padding: 10px 20px; border-radius: 999px;
    border: 1.5px solid rgba(125, 180, 255, .55); font-size: 18px; font-weight: 600; color: #e6edff;
    background-color: rgba(43, 140, 255, .14);
  }

  .window {
    position: absolute; left: 700px; top: 64px; width: 500px; height: 760px;
    border-radius: 16px; background: #f8fafc; overflow: hidden;
    box-shadow: 0 30px 80px rgba(0, 0, 0, .6), 0 0 0 1px rgba(255, 255, 255, .12);
  }
  .bar { height: 36px; background: #e9eef7; display: flex; align-items: center; gap: 7px; padding: 0 14px; }
  .dot { width: 11px; height: 11px; border-radius: 50%; }
  .shot { display: block; width: 100%; }
</style>
</head>
<body>
  <section class="left">
    <div class="badge"><img src="../../apps/web/public/logo-mark.png" alt=""></div>
    <h1>CodeBase<br><span class="doctor">Doctor</span> IA</h1>
    <p class="tagline">Analiza un repo de GitHub y devuelve <b>un puntaje de 0 a 100 en seis dimensiones</b>.</p>
    <div class="stack">NestJS · React · BullMQ · Prisma · Docker</div>
  </section>

  <section class="window">
    <div class="bar">
      <span class="dot" style="background:#ff5f57"></span><span class="dot" style="background:#febc2e"></span><span class="dot" style="background:#28c840"></span>
    </div>
    <img class="shot" src="../../docs/img/portfolio/report-es.png" alt="">
  </section>
</body>
</html>
