services:
  postgres:
    image: postgres:16-alpine
    container_name: cbd-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: cbd
      POSTGRES_PASSWORD: cbd
      POSTGRES_DB: codebase_doctor
    ports:
      - "5432:5432"
    volumes:
      - cbd-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cbd -d codebase_doctor"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: cbd-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  cbd-postgres-data:
